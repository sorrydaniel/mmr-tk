<!DOCTYPE html>
<html lang="et" class="h-full">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Logi sisse – MMR → TK konverter</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="flex h-full items-center justify-center bg-slate-100 px-4">
  <div class="w-full max-w-sm rounded-2xl border border-slate-200 bg-white p-6 shadow-sm">
    <h1 class="text-lg font-semibold text-slate-900">MMR → TK konverter</h1>
    <p class="mt-1 text-sm text-slate-500">Rakendus on parooliga kaitstud.</p>

    {% if error %}
      <p class="mt-4 rounded-lg bg-rose-50 px-3 py-2 text-sm text-rose-700">{{ error }}</p>
    {% endif %}

    <form method="post" action="/login" class="mt-5 space-y-4">
      <div>
        <label for="password" class="block text-sm font-medium text-slate-700">Parool</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required
               class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2 text-sm focus:border-slate-500 focus:outline-none focus:ring-1 focus:ring-slate-500">
      </div>
      <button type="submit"
              class="w-full rounded-lg bg-slate-800 px-3 py-2 text-sm font-medium text-white hover:bg-slate-700">
        Logi sisse
      </button>
    </form>
  </div>
</body>
</html>
